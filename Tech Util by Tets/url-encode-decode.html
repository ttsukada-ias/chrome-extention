<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URL Parse / Encode / Decode</title>
  <style>
    :root {
      --brand: #e9a24a;
      --text: #2f2418;
      --muted: #6f6254;
      --surface: #ffffff;
      --border: #ead7bd;
      --danger: #a12d2d;
      --danger-bg: #fff2f2;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #fffaf3 0%, #fff4e6 100%);
      color: var(--text);
      padding: 24px;
    }

    .page {
      max-width: 1180px;
      margin: 0 auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 18px 44px rgba(47, 36, 24, 0.08);
    }

    .header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-start;
      margin-bottom: 20px;
    }

    h1 { margin: 0 0 8px; font-size: 28px; }

    .meta {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    button {
      appearance: none;
      border: 1px solid #e3ba7a;
      border-radius: 8px;
      background: #fff0d8;
      color: var(--text);
      cursor: pointer;
      font: 700 13px/1 Arial, Helvetica, sans-serif;
      min-height: 36px;
      padding: 10px 14px;
    }

    button:hover:not(:disabled) { background: #ffe3b8; border-color: #d99a45; }
    button:disabled { cursor: not-allowed; opacity: 0.55; }
    .secondary { background: #ffffff; }

    /* Workspace: input left, output right */
    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 16px;
      align-items: start;
    }

    .panel-label {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 8px;
      display: block;
    }

    textarea {
      width: 100%;
      min-height: 320px;
      resize: vertical;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      background: #fffdfa;
      color: var(--text);
      font-family: Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      line-height: 1.55;
    }

    textarea:focus {
      outline: 2px solid rgba(233, 162, 74, 0.30);
      border-color: var(--brand);
    }

    textarea[readonly] { background: #fffaf3; }

    /* Action bar between panels */
    .action-bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 14px 0;
      align-items: center;
    }

    .divider {
      width: 1px;
      height: 24px;
      background: var(--border);
      margin: 0 2px;
    }

    /* Parse output panel */
    .parse-output {
      display: none;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      background: #fffaf3;
      min-height: 320px;
    }

    .parse-output.visible { display: block; }

    .url-parts {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      font-family: Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      line-height: 1.7;
    }

    .url-part-row {
      display: grid;
      grid-template-columns: 76px 1fr;
      gap: 8px;
      align-items: baseline;
    }

    .url-part-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      font-family: Arial, Helvetica, sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .url-part-value { color: var(--text); word-break: break-all; }

    .params-table {
      width: 100%;
      border-collapse: collapse;
    }

    .params-table thead th {
      background: #f9f2e6;
      text-align: left;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 7px 14px;
      border-bottom: 1px solid var(--border);
    }

    .params-table tbody tr { border-bottom: 1px solid #f2e8d9; }
    .params-table tbody tr:last-child { border-bottom: none; }
    .params-table tbody tr:hover { background: #fffaf3; }

    .params-table td {
      padding: 7px 14px;
      font-family: Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      vertical-align: top;
      word-break: break-all;
    }

    .param-key { color: #7a4f1f; font-weight: 600; white-space: nowrap; }
    .param-eq  { color: var(--muted); padding: 7px 4px; font-family: Menlo, Monaco, Consolas, monospace; font-size: 13px; }
    .param-val { color: var(--text); }

    .no-params {
      padding: 12px 14px;
      font-size: 13px;
      color: var(--muted);
      font-style: italic;
    }

    .status {
      margin-top: 12px;
      min-height: 20px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .status.error {
      display: inline-block;
      color: var(--danger);
      background: var(--danger-bg);
      border: 1px solid #f1c7c7;
      border-radius: 8px;
      padding: 8px 10px;
    }

    @media (max-width: 820px) {
      body { padding: 14px; }
      .page { padding: 18px; }
      .workspace { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="header">
      <div>
        <h1>URL Parse / Encode / Decode</h1>
        <p class="meta">Paste a URL or text — then Parse, Encode, or Decode.</p>
      </div>
    </div>

    <div class="workspace">
      <!-- Input -->
      <div>
        <span class="panel-label">Input</span>
        <textarea id="urlInput" spellcheck="false" placeholder="https://example.com/search?q=hello+world&amp;lang=en#results"></textarea>
      </div>

      <!-- Output -->
      <div>
        <span class="panel-label" id="outputLabel">Output</span>

        <!-- Text output (encode/decode) -->
        <textarea id="urlOutput" spellcheck="false" readonly style="display:none"></textarea>

        <!-- Structured parse output -->
        <div class="parse-output" id="parseOutput">
          <div class="url-parts" id="urlParts"></div>
          <table class="params-table" id="paramsTable">
            <thead><tr><th>Key</th><th></th><th>Value</th></tr></thead>
            <tbody id="paramsBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="action-bar">
      <button type="button" id="parseButton">Parse</button>
      <div class="divider"></div>
      <button type="button" id="encodeButton">Encode</button>
      <button type="button" id="decodeButton">Decode</button>
      <div class="divider"></div>
      <button type="button" class="secondary" id="copyButton" disabled>Copy</button>
      <button type="button" class="secondary" id="clearButton">Clear</button>
    </div>

    <div class="status" id="status"></div>
  </main>

  <script src="url-encode-decode.js"></script>
</body>
</html>
