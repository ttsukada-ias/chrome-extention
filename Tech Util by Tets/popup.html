<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tech Util by Tets</title>
  <style>
    :root {
      --brand: #e9a24a;
      --text: #2f2418;
      --muted: #6f6254;
      --surface: #ffffff;
      --border: #ead7bd;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      width: 300px;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #fffaf3 0%, #fff4e6 100%);
      color: var(--text);
    }

    .wrap { padding: 16px; }

    .title {
      font-size: 18px;
      font-weight: 700;
      margin: 0 0 6px;
    }

    .subtitle {
      font-size: 13px;
      color: var(--muted);
      margin: 0 0 14px;
      line-height: 1.45;
    }

    .list {
      display: grid;
      gap: 10px;
    }

    /* Each item wraps handle + button */
    .list-item {
      display: flex;
      align-items: stretch;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      transition: border-color 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
      cursor: default;
    }

    .list-item:hover {
      border-color: var(--brand);
      box-shadow: 0 8px 20px rgba(233, 162, 74, 0.20);
    }

    .list-item.dragging {
      opacity: 0.4;
    }

    .list-item.drag-over {
      border-color: var(--brand);
      box-shadow: 0 0 0 2px rgba(233, 162, 74, 0.40);
    }

    .drag-handle {
      display: flex;
      align-items: center;
      padding: 0 8px 0 10px;
      cursor: grab;
      color: #cbb89a;
      font-size: 14px;
      flex-shrink: 0;
      user-select: none;
    }

    .drag-handle:active { cursor: grabbing; }

    .link-btn {
      flex: 1;
      border: none;
      border-radius: 0 12px 12px 0;
      background: transparent;
      color: var(--text);
      text-align: left;
      padding: 12px 14px 12px 4px;
      cursor: pointer;
      min-width: 0;
    }

    .link-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .link-copy {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1 class="title">Tech Util by Tets</h1>
    <p class="subtitle">Open standalone technical helper tools in a new tab.</p>
    <div class="list" id="toolList"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
