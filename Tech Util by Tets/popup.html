<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tech Util by Tets</title>
  <style>
    :root {
      --brand: #e9a24a;
      --text: #2f2418;
      --muted: #6f6254;
      --surface: #ffffff;
      --border: #ead7bd;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      width: 300px;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #fffaf3 0%, #fff4e6 100%);
      color: var(--text);
    }

    .wrap {
      padding: 16px;
    }

    .title {
      font-size: 18px;
      font-weight: 700;
      margin: 0 0 6px;
    }

    .subtitle {
      font-size: 13px;
      color: var(--muted);
      margin: 0 0 14px;
      line-height: 1.45;
    }

    .list {
      display: grid;
      gap: 10px;
    }

    .link-btn {
      display: block;
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
      text-align: left;
      padding: 12px 14px;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .link-btn:hover {
      transform: translateY(-1px);
      border-color: var(--brand);
      box-shadow: 0 8px 20px rgba(233, 162, 74, 0.20);
    }

    .link-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .link-copy {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1 class="title">Tech Util by Tets</h1>
    <p class="subtitle">Open standalone technical helper tools in a new tab.</p>

    <div class="list">
      <button type="button" class="link-btn" id="openJsonToCsv">
        <div class="link-title">Json to CSV</div>
        <div class="link-copy">Convert pasted JSON into a downloadable CSV file.</div>
      </button>

      <button type="button" class="link-btn" id="openJsonBeautilier">
        <div class="link-title">Json Beautilier</div>
        <div class="link-copy">Beautify pasted JSON and copy it to your clipboard.</div>
      </button>

      <button type="button" class="link-btn" id="openXmlBeautifier">
        <div class="link-title">XML Beautifier</div>
        <div class="link-copy">Beautify pasted XML and copy it to your clipboard.</div>
      </button>

      <button type="button" class="link-btn" id="openXmlToJson">
        <div class="link-title">XML to JSON</div>
        <div class="link-copy">Convert XML into structured JSON for easier viewing.</div>
      </button>

      <button type="button" class="link-btn" id="openUrlEncodeDecode">
        <div class="link-title">URL Encode/Decode</div>
        <div class="link-copy">Encode text for URLs or decode URL-encoded strings.</div>
      </button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
