<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Helper by Tets</title>
  <style>
    :root {
      --brand: #57c3bb;
      --brand-dark: #26988f;
      --text: #163233;
      --muted: #5f7172;
      --surface: #ffffff;
      --border: #d7e7e5;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 300px;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #f7fcfb 0%, #eef8f7 100%);
      color: var(--text);
    }

    .wrap {
      padding: 16px;
    }

    .title {
      font-size: 18px;
      font-weight: 700;
      margin: 0 0 6px;
    }

    .subtitle {
      font-size: 13px;
      color: var(--muted);
      margin: 0 0 14px;
      line-height: 1.45;
    }

    .list {
      display: grid;
      gap: 10px;
    }

    .link-btn {
      display: block;
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
      text-align: left;
      padding: 12px 14px;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .link-btn:hover:not(:disabled) {
      transform: translateY(-1px);
      border-color: var(--brand);
      box-shadow: 0 8px 20px rgba(87, 195, 187, 0.16);
    }

    .link-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .link-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .link-copy {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.4;
    }

    .status {
      margin-top: 12px;
      font-size: 12px;
      line-height: 1.45;
      color: var(--muted);
      min-height: 34px;
    }

    .status.ready {
      color: var(--brand-dark);
    }

    .list-item {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: grab;
    }

    .list-item.dragging {
      opacity: 0.4;
    }

    .list-item.drag-over {
      border-top: 2px solid var(--brand);
    }

    .drag-handle {
      flex: 0 0 auto;
      color: var(--border);
      font-size: 16px;
      line-height: 1;
      cursor: grab;
      padding: 0 2px;
      user-select: none;
    }

    .list-item:hover .drag-handle {
      color: var(--brand);
    }

    .link-btn {
      flex: 1;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1 class="title">Helper by Tets</h1>
    <p class="subtitle">Choose a tool to open in a new tab using your captured Publica session.</p>

    <div class="list" id="toolList">
      <div class="list-item" draggable="true" data-tool="openRtbStream">
        <span class="drag-handle">⠿</span>
        <button type="button" class="link-btn" id="openRtbStream">
          <div class="link-title">RTB Stream</div>
          <div class="link-copy">Open the RTB Stream page in a new tab.</div>
        </button>
      </div>

      <div class="list-item" draggable="true" data-tool="openLiveLogs">
        <span class="drag-handle">⠿</span>
        <button type="button" class="link-btn" id="openLiveLogs">
          <div class="link-title">Live Logs</div>
          <div class="link-copy">Open Live Logs page in new tab.</div>
        </button>
      </div>

      <div class="list-item" draggable="true" data-tool="openBidderChannelMappings">
        <span class="drag-handle">⠿</span>
        <button type="button" class="link-btn" id="openBidderChannelMappings">
          <div class="link-title">Channel/Bidder Mappings</div>
          <div class="link-copy">Open a new Mapping page in a new tab.</div>
        </button>
      </div>

      <div class="list-item" draggable="true" data-tool="openCreativeReview">
        <span class="drag-handle">⠿</span>
        <button type="button" class="link-btn" id="openCreativeReview">
          <div class="link-title">Creative Review</div>
          <div class="link-copy">Open Creative Review page in a new tab.</div>
        </button>
      </div>

      <div class="list-item" draggable="true" data-tool="openBidderInfo">
        <span class="drag-handle">⠿</span>
        <button type="button" class="link-btn" id="openBidderInfo">
          <div class="link-title">Bidder Info</div>
          <div class="link-copy">Open Bidder Info page in a new tab.</div>
        </button>
      </div>
    </div>

    <div class="status" id="status">Open Publica first so the extension can capture your auth context.</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
