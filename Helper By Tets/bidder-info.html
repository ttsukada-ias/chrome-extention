<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bidder Info by Tets</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #f6fcfb 0%, #edf8f6 100%);
      color: #163233;
      padding: 24px;
    }

    .page {
      max-width: 1380px;
      margin: 0 auto;
      background: #ffffff;
      border: 1px solid #d7e7e5;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 18px 44px rgba(22, 50, 51, 0.08);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
    }

    .intro {
      margin: 0 0 18px;
      color: #4b6263;
      line-height: 1.5;
    }

    .status {
      margin-bottom: 18px;
      padding: 12px 14px;
      border-radius: 12px;
      background: #eef8f7;
      color: #1f7f78;
      font-weight: 700;
    }

    .status.warn {
      background: #fff4e8;
      color: #a15c00;
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(260px, 1.6fr) repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
      align-items: end;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 700;
    }

    .field input,
    .field select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cfe1df;
      border-radius: 10px;
      font-size: 14px;
      background: #fff;
      color: #163233;
    }

    button {
      width: 100%;
      padding: 10px 12px;
      border: 0;
      border-radius: 10px;
      background: #0d6e8a;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .results {
      border: 1px solid #d7e7e5;
      border-radius: 14px;
      background: #fbfefe;
      min-height: 320px;
      max-height: 72vh;
      overflow: auto;
      padding: 10px;
    }

    .results-table-header,
    .results-table-row {
      display: grid;
      grid-template-columns: 90px minmax(220px, 1.3fr) 160px 160px minmax(320px, 1.7fr);
      gap: 8px;
      align-items: stretch;
    }

    .results-table-header {
      position: sticky;
      top: 0;
      z-index: 1;
      margin-bottom: 8px;
      padding: 0 2px;
      background: #fbfefe;
    }

    .results-table-head {
      padding: 10px 12px;
      border-radius: 10px;
      background: #dff0ee;
      color: #163233;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .results-table-row {
      border: 1px solid #e3efee;
      border-radius: 10px;
      background: #fff;
      margin-bottom: 8px;
      overflow: hidden;
    }

    .results-table-cell {
      padding: 10px 12px;
      min-width: 0;
      border-left: 1px solid #eef5f4;
      font-size: 13px;
      line-height: 1.5;
      word-break: break-word;
    }

    .results-table-cell:first-child {
      border-left: 0;
    }

    .bidder-name {
      font-size: 14px;
      font-weight: 800;
      color: #0d6e8a;
      margin-bottom: 2px;
    }

    .bidder-key {
      color: #607576;
      font-size: 12px;
    }

    .params-list {
      max-height: 220px;
      overflow: auto;
      font-family: Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      line-height: 1.6;
    }

    .params-row {
      display: flex;
      gap: 6px;
    }

    .params-key {
      color: #0d6e8a;
      flex: 0 0 auto;
    }

    .params-value {
      color: #163233;
      word-break: break-all;
    }

    .empty {
      color: #607576;
      padding: 10px 6px;
    }

    @media (max-width: 980px) {
      .toolbar {
        grid-template-columns: 1fr;
      }

      .results-table-header,
      .results-table-row {
        grid-template-columns: 1fr !important;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <h1>Bidder Info by Tets</h1>
    <p class="intro">Lists every bidder configured for this publisher, including params and mapped site IDs.</p>

    <div class="status" id="authStatus">Checking auth context...</div>

    <div class="toolbar">
      <div class="field">
        <label for="searchInput">Search</label>
        <input type="text" id="searchInput" placeholder="Search by ID, name, or bidder key..." />
      </div>
      <div class="field">
        <label for="statusFilter">Status</label>
        <select id="statusFilter">
          <option value="2" selected>Active</option>
          <option value="1">Inactive</option>
          <option value="0">All</option>
        </select>
      </div>
      <div class="field">
        <label for="reloadButton">&nbsp;</label>
        <button type="button" id="reloadButton">Reload</button>
      </div>
      <div class="field">
        <label for="exportButton">&nbsp;</label>
        <button type="button" id="exportButton">Export CSV</button>
      </div>
    </div>

    <div class="results" id="results"></div>
  </div>

  <script src="bidder-info.js"></script>
</body>
</html>
