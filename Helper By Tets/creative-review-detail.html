<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Creative Review Detail</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #f6fcfb 0%, #edf8f6 100%);
      color: #163233;
    }

    .page {
      max-width: 1180px;
      margin: 0 auto;
      background: #fff;
      border: 1px solid #d7e7e5;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 18px 44px rgba(22, 50, 51, 0.08);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
    }

    .intro {
      margin: 0 0 18px;
      color: #4b6263;
      line-height: 1.5;
    }

    .status {
      margin-bottom: 18px;
      padding: 12px 14px;
      border-radius: 12px;
      background: #eef8f7;
      color: #1f7f78;
      font-weight: 700;
    }

    .status.warn {
      background: #fff4e8;
      color: #a15c00;
    }

    .summary {
      margin-bottom: 16px;
      color: #607576;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-all;
    }

    .bulk-panel {
      margin-bottom: 18px;
      padding: 16px;
      border: 1px solid #d7e7e5;
      border-radius: 14px;
      background: #fbfefe;
    }

    .bulk-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 14px;
    }

    .bulk-grid-secondary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 14px;
    }

    .bulk-field label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 700;
    }

    .bulk-field input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cfe1df;
      border-radius: 10px;
      font-size: 14px;
      background: #fff;
      color: #163233;
    }

    .bulk-field input[readonly] {
      background: #f4f9f8;
      color: #4b6263;
    }

    .bulk-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .action-button {
      appearance: none;
      border: 1px solid transparent;
      border-radius: 12px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      background: #e8eff7;
      color: #29518b;
    }

    .action-button:hover {
      filter: brightness(0.98);
    }

    .action-button.unreviewed {
      background: #f1eafd;
      color: #6a3db4;
      border-color: #dacaf6;
    }

    .action-button.reviewed {
      background: #e8effb;
      color: #335f9b;
      border-color: #cfddf4;
    }

    .action-button.allow {
      background: #e1f3ec;
      color: #257354;
      border-color: #bfe6d6;
    }

    .action-button.block {
      background: #fdeceb;
      color: #bd4d43;
      border-color: #f4cdc8;
    }

    .action-button.update {
      background: #e8f5f6;
      color: #2c6b72;
      border-color: #cae4e7;
    }

    .action-button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .table-wrap {
      overflow: auto;
      border: 1px solid #d7e7e5;
      border-radius: 12px;
      background: #fff;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1380px;
    }

    th,
    td {
      padding: 10px 12px;
      border-bottom: 1px solid #e2efed;
      text-align: left;
      vertical-align: top;
      font-size: 14px;
    }

    th {
      position: sticky;
      top: 0;
      background: #eef8f7;
      color: #1b4f50;
      font-size: 13px;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    td a {
      color: #12746f;
      text-decoration: none;
      word-break: break-all;
    }

    td a:hover {
      text-decoration: underline;
    }

    .preview-link {
      display: inline-flex;
      width: 100%;
      justify-content: center;
      line-height: 0;
    }

    .preview-video {
      width: 100%;
      max-width: 520px;
      height: auto;
      display: block;
      cursor: pointer;
      border-radius: 8px;
      background: #0f2021;
    }

    .preview-cell {
      width: 560px;
      min-width: 560px;
      padding: 12px;
    }

    .preview-tile {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 292px;
      border: 1px solid #dbe9e8;
      border-radius: 10px;
      background: linear-gradient(180deg, #f7fbfb 0%, #eef8f7 100%);
      overflow: hidden;
    }

    .empty-state {
      padding: 18px;
      color: #607576;
      font-size: 14px;
    }

    @media (max-width: 980px) {
      .bulk-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <h1>Creative Review Detail</h1>
    <p class="intro">This page shows the creative review results for one specific creative URL filter.</p>
    <div class="status" id="detailStatus">Loading creative detail...</div>
    <div class="summary" id="detailSummary"></div>
    <div class="bulk-panel">
      <div class="bulk-grid">
        <div class="bulk-field">
          <label for="bulkReviewStatus">Status</label>
          <input type="text" id="bulkReviewStatus" readonly />
        </div>
        <div class="bulk-field">
          <label for="bulkCreativeUrl">Creative URL</label>
          <input type="text" id="bulkCreativeUrl" readonly />
        </div>
        <div class="bulk-field">
          <label for="bulkAdomain">Adomain</label>
          <input type="text" id="bulkAdomain" />
        </div>
        <div class="bulk-field">
          <label for="bulkIabCategory">IAB Category</label>
          <input type="text" id="bulkIabCategory" />
        </div>
      </div>
      <div class="bulk-grid-secondary">
        <div class="bulk-field"></div>
        <div class="bulk-field"></div>
        <div class="bulk-field">
          <label for="bulkAdomainOverride">Adomain Override (original)</label>
          <input type="text" id="bulkAdomainOverride" readonly />
        </div>
        <div class="bulk-field">
          <label for="bulkIabCategoryOverride">IAB Category Override (original)</label>
          <input type="text" id="bulkIabCategoryOverride" readonly />
        </div>
      </div>
      <div class="bulk-actions">
        <button type="button" class="action-button unreviewed" id="bulkUnreviewedButton">Unreviewed</button>
        <button type="button" class="action-button reviewed" id="bulkReviewedButton">Reviewed</button>
        <button type="button" class="action-button allow" id="bulkAllowButton">Allow</button>
        <button type="button" class="action-button block" id="bulkBlockButton">Block</button>
        <button type="button" class="action-button update" id="bulkUpdateButton">Update</button>
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Creative Preview</th>
            <th>Bidder ID</th>
            <th>Bidder Name</th>
            <th>Total Count</th>
            <th>Impressions</th>
            <th>Bid Error Blocked Responses</th>
          </tr>
        </thead>
        <tbody id="detailBody">
          <tr>
            <td colspan="6" class="empty-state">Loading...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="creative-review-detail.js"></script>
</body>
</html>
